<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocco Verna — Insegnante ed epistemologo classico</title>
<meta name="description" content="Tutti i libri di Rocco Verna: manuali per la scuola e saggi sulla trasformazione sociale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3EE; --surface:#E7E9E1; --ink:#1B2426; --ink-2:#4B585A; --rule:#C9CFC6; --link:#1F5A73;
  --board:#1E2A2B; --chalk:#ECEBE4; --chalk-2:#A9B8B4; --yellow:#E3C04D; --blue:#A9C4D3;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pad:clamp(20px,5vw,56px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121A1B; --surface:#1A2526; --ink:#E6E8E1; --ink-2:#A3AFAB; --rule:#2E3A3B; --link:#93BFD5; }
}
:root[data-theme="dark"]{ --bg:#121A1B; --surface:#1A2526; --ink:#E6E8E1; --ink-2:#A3AFAB; --rule:#2E3A3B; --link:#93BFD5; }

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--board);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6}
a{color:var(--link)}
a:focus-visible{outline:3px solid var(--link);outline-offset:3px}
main{display:block}
main:focus{outline:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--pad)}
.skip{position:absolute;left:-999px;top:8px;background:var(--yellow);color:#1B2426;padding:10px 16px;z-index:10;border-radius:2px}
.skip:focus{left:8px}

/* Header */
.board{background:var(--board);color:var(--chalk)}
.board a:focus-visible{outline-color:var(--chalk)}
.site-head .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-block:14px}
.brand{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--chalk);text-decoration:none;letter-spacing:-.005em}
.nav{display:flex;gap:4px}
.nav a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;color:var(--chalk);text-decoration:none;font-size:15px}
.nav a:hover{color:var(--yellow)}
.nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--yellow)}

/* Hero */
.hero{position:relative;isolation:isolate;overflow:hidden;padding-top:clamp(36px,6vw,88px)}
.hero-bg{position:absolute;inset:0;z-index:-1;width:100%;height:100%;object-fit:cover;opacity:.2;filter:saturate(.75);pointer-events:none}
.hero-grid{display:grid;gap:36px;align-items:end}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px}}
.hero-text{padding-bottom:clamp(28px,4vw,52px)}
.hero h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(64px,10vw,140px);line-height:.92;letter-spacing:-.025em}
.role{margin:22px 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(22px,3vw,34px);color:var(--yellow)}
.hero-sub{margin:10px 0 0;color:var(--chalk);max-width:34ch;font-size:18px}

.shelf{display:flex;align-items:flex-end;gap:6px}
.spine{flex:1 1 0;min-width:0;max-width:84px;--k:1;height:calc(var(--h) * var(--k) * 1px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;border-radius:3px 3px 0 0;color:#1B2426;text-decoration:none;transition:transform .2s ease}
.spine.saggio{background:var(--yellow)}
.spine.scuola{background:var(--blue)}
.spine .t{flex:1 1 0;min-height:0;height:100%;overflow:hidden;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-weight:500;font-size:clamp(12px,1.25vw,16px);line-height:1.15;padding:0 5px}
.spine .y{font-family:var(--mono);font-size:11px;line-height:1;min-height:11px}
.spine:hover,.spine:focus-visible{transform:translateY(-12px)}
.spine:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.shelf.intro .spine{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes rise{from{transform:translateY(36px);opacity:0}}
@media (max-width:899px){.spine .t{font-size:clamp(12px,2.2vw,16px)}}
@media (max-width:560px){.spine{--k:.78}}
.ledge{height:10px;background:var(--chalk)}
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;padding:16px 0 30px;font-family:var(--mono);font-size:12.5px;color:var(--chalk)}
.legend span,.group h3 span.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.sw.saggio{background:var(--yellow)}
.sw.scuola{background:var(--blue)}

/* Home sections */
.section{padding:clamp(56px,8vw,108px) 0}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,48px);line-height:1.1;letter-spacing:-.01em;margin:0}
.group{margin-top:clamp(36px,5vw,60px)}
.group h3{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;color:var(--ink-2)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 24px;align-items:start;padding:24px 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none}
.group .row:last-child{border-bottom:1px solid var(--rule)}
.row h4{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.15}
.row .teaser{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.row .meta{margin:0;font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink-2);text-align:right}
.row .meta span{display:block}
.row:hover h4,.row:focus-visible h4{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.thumb{display:block;width:64px;aspect-ratio:2/3;object-fit:cover;object-position:top;background:#fff;border:1px solid var(--rule)}
@media (max-width:560px){.row{grid-template-columns:52px minmax(0,1fr);gap:6px 16px}.thumb{width:52px}.row .meta{grid-column:2;text-align:left}.row .meta span{display:inline;margin-right:12px}}

.bio-teaser{background:var(--surface)}
.bio-teaser .grid{display:grid;gap:28px}
@media (min-width:900px){.bio-teaser .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:72px;align-items:start}}
.bio-teaser p{margin:0 0 20px;font-family:var(--serif);font-size:clamp(21px,2.4vw,27px);line-height:1.45;max-width:36em}

.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 24px;border:1.5px solid currentColor;border-radius:2px;font-family:var(--sans);font-weight:500;font-size:16px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:transparent;color:var(--ink)}
.btn.chalk{background:var(--yellow);color:#1B2426;border-color:var(--yellow)}
.btn.chalk:hover{background:transparent;color:var(--yellow)}

/* Book page */
.crumbs{padding:28px 0 0}
.crumbs a{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.book-grid{display:grid;gap:36px;padding:28px 0 clamp(48px,7vw,88px)}
@media (min-width:860px){.book-grid{grid-template-columns:300px minmax(0,1fr);gap:72px;align-items:start}.cover-col{position:sticky;top:24px}}
.cover-img{display:block;width:min(100%,300px);height:auto;background:#fff;border:1px solid var(--rule)}
.cover-more{display:flex;gap:12px;width:min(100%,300px);margin-top:12px}
.cover-more img{display:block;flex:0 0 calc(50% - 6px);min-width:0;width:calc(50% - 6px);height:auto;background:#fff;border:1px solid var(--rule)}
@media (max-width:859px){.cover-img,.cover-more{width:min(100%,240px)}}
.book-head h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-.015em}
.book-head .sub{margin:10px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,26px);color:var(--ink-2)}
.byline{margin:18px 0 0;font-family:var(--mono);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.prose{max-width:62ch;margin-top:34px;font-size:18px;line-height:1.7}
.prose p{margin:0 0 1.1em}
.prose p.lead{font-family:var(--serif);font-size:clamp(21px,2.4vw,26px);line-height:1.45}
.prose blockquote{margin:1.6em 0;padding:0}
.prose blockquote p{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.2vw,24px);line-height:1.45}
.prose ul.levels,.prose ol.questioni{list-style:none;margin:1.6em 0;padding:0}
.prose .levels li{padding:16px 0;border-top:1px solid var(--rule)}
.prose .levels li:last-child{border-bottom:1px solid var(--rule)}
.prose .questioni{counter-reset:q}
.prose .questioni li{display:grid;grid-template-columns:2.4em minmax(0,1fr);padding:16px 0;border-top:1px solid var(--rule)}
.prose .questioni li:last-child{border-bottom:1px solid var(--rule)}
.prose .questioni li::before{counter-increment:q;content:counter(q);font-family:var(--mono);font-size:14px;color:var(--ink-2);padding-top:.35em}
.prose .questioni strong{display:block;font-family:var(--serif);font-weight:500;font-size:1.2em;line-height:1.25;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.pager{display:flex;justify-content:space-between;gap:24px;padding:28px 0 clamp(48px,7vw,88px);border-top:1px solid var(--rule)}
.pager a{display:block;max-width:44%;color:var(--ink);text-decoration:none}
.pager a:hover .pt{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.pager .next{margin-left:auto;text-align:right}
.pager .pl{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.pager .pt{font-family:var(--serif);font-size:clamp(18px,2vw,22px);line-height:1.25}

/* Biografia */
.bio-page h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(48px,8vw,100px);line-height:.95;letter-spacing:-.02em}
.bio-grid{display:grid;gap:36px;padding:40px 0 clamp(56px,8vw,104px)}
@media (min-width:900px){.bio-grid{grid-template-columns:270px minmax(0,1fr);gap:72px;align-items:start}.facts{position:sticky;top:24px}}
.facts{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.5}
.facts div{padding:14px 0;border-top:1px solid var(--rule)}
.facts dt{color:var(--ink-2)}
.facts dd{margin:2px 0 0}
.bio-prose{max-width:62ch;font-size:18px;line-height:1.7}
.bio-prose p{margin:0 0 1.1em}
.bio-prose p.lead{font-family:var(--serif);font-size:clamp(21px,2.4vw,26px);line-height:1.45}
.bio-prose p.q{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.2vw,24px);line-height:1.45;margin-bottom:.7em}

/* Footer */
.site-foot{margin-top:0}
.site-foot .foot-grid{display:grid;gap:28px;padding-top:clamp(48px,7vw,88px);padding-bottom:clamp(48px,7vw,80px)}
@media (min-width:900px){.site-foot .foot-grid{grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:72px}}
.site-foot h2{color:var(--chalk)}
.site-foot p{margin:14px 0 0;color:var(--chalk-2);max-width:44ch;font-size:18px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function prose(body){

    if (b.q) return `<blockquote><p>${b.q}</p></blockquote>`;
    if (b.levels) return `<ul class="levels">${b.levels.map(l => `<li>${l}</li>`).join('')}</ul>`;
    if (b.list) return `<ol class="questioni">${b.list.map(x => `<li><div><strong>${x.t}</strong>${x.h}</div></li>`).join('')}</ol>`;
    return '';
  }).join('');
}

  if (i < 0) return renderHome();
  const b = BOOKS[i], prev = BOOKS[i-1], next = BOOKS[i+1], pics = PICS[b.slug] || [];
  document.title = b.title + ' — Rocco Verna';
  main.innerHTML = `
  <article class="wrap">
    <div class="crumbs"><a href="#/libri">Tutti i libri</a></div>
    <div class="book-grid">
      <div class="cover-col">
        ${pics[0] ? `<img class="cover-img" src="${IMG[pics[0][0]]}" alt="${pics[0][1]}">` : ''}
        ${pics.length > 1 ? `<div class="cover-more">${pics.slice(1).map(p => `<img src="${IMG[p[0]]}" alt="${p[1]}">`).join('')}</div>` : ''}
      </div>
      <div>
        <div class="book-head">
          <h1>${b.title}</h1>
          ${b.sub ? `<p class="sub">${b.sub}</p>` : ''}
          <p class="byline">${b.by}${b.publine ? '<br>' + b.publine : ''}</p>
        </div>
        <div class="prose">${prose(b.body)}</div>
        <div class="actions">
          <a class="btn primary" href="${b.pdf}" target="_blank" rel="noopener">Scarica il PDF</a>
          ${b.scheda ? `<a class="btn" href="${b.scheda}" target="_blank" rel="noopener">Scheda dell’editore</a>` : ''}
        </div>
      </div>
    </div>
    <nav class="pager" aria-label="Altri libri">
      ${prev ? `<a class="prev" href="#/libro/${prev.slug}"><span class="pl">Precedente</span><span class="pt">${prev.title}</span></a>` : '<span></span>'}
      ${next ? `<a class="next" href="#/libro/${next.slug}"><span class="pl">Successivo</span><span class="pt">${next.title}</span></a>` : ''}
    </nav>
  </article>`;
}

function renderBio(){
  document.title = 'Biografia — Rocco Verna';
  const paras = BIO.map((b,i) => typeof b === 'string' ? `<p${i===0 ? ' class="lead"' : ''}>${b}</p>` : `<p class="q">${b.q}</p>`).join('');
  main.innerHTML = `
  <article class="wrap bio-page">
    <div class="crumbs"><a href="#/">Tutti i libri</a></div>
    <h1 style="margin-top:28px">Biografia</h1>
    <div class="bio-grid">
      <dl class="facts">
        <div><dt>Nato</dt><dd>1948</dd></div>
        <div><dt>Laurea</dt><dd>Filosofia, Sapienza di Roma, 1971</dd></div>
        <div><dt>Insegnamento</dt><dd>Triennio finale delle superiori</dd></div>
        <div><dt>Ministero della Pubblica Istruzione</dt><dd>Commissione Brocca. Stand sul laboratorio di storia a Job &amp; Orienta, Verona 1995, e alla Fiera del libro per ragazzi, Bologna 1996</dd></div>
      </dl>
      <div class="bio-prose">${paras}</div>
    </div>
  </article>`;
}

function route(){
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const page = parts[0] || '';
  let nav = '';
  if (page === 'libro') { renderBook(parts[1]); nav = 'libri'; }
  else if (page === 'biografia') { renderBio(); nav = 'biografia'; }
  else if (page === 'contatti') { if (!main.querySelector('article, section')) renderHome(); nav = 'contatti'; }
  else { renderHome(); nav = page === 'libri' ? 'libri' : ''; }

  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });

  if (page === 'libri') document.getElementById('libri').scrollIntoView();
  else if (page === 'contatti') document.getElementById('contatti').scrollIntoView();
  else window.scrollTo(0,0);
}

document.getElementById('skip').addEventListener('click', e => { e.preventDefault(); main.focus(); });
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
